[project]
name = "trencher"
version = "0.1.0"
description = "On-chain meme-coin world model — raw Dune extraction pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "click>=8.1",
    "dune-client>=1.7",
    "google-cloud-bigquery>=3.25",
    "huggingface-hub>=1.29.0",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "pyyaml>=6.0",
    "requests>=2.34.2",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]
baselines = [
    "catboost>=1.2",
    "lifelines>=0.29",
    "lightgbm>=4.5",
    "modal>=0.73",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
]
torch = [
    "torch>=2.2",
]

[project.scripts]
trencher = "trencher.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trencher"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/trencher/baselines/**" = ["E501"]
"modal_apps/**" = ["E501"]
"tests/test_baselines_v1.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
